[env:esp32-s3-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; This board (ESP32-S3-...-N16R8) has 16MB Quad-SPI flash + 8MB Octal-SPI
; PSRAM. "qio_opi" tells the Arduino core to use Quad I/O for flash and
; Octal I/O for PSRAM, matching this exact chip variant — using the wrong
; memory_type here is a common cause of a board that flashes fine but
; crashes/reboots the moment PSRAM is touched.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags = -DBOARD_HAS_PSRAM

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bblanchon/ArduinoJson @ ^6.21.5
    mikalhart/TinyGPSPlus @ ^1.0.3
    rfetick/MPU6050_light @ ^1.1.0
    mprograms/QMC5883LCompass @ ^1.1.1
